name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.22"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - name: Documentation links and release metadata
        run: uv run --locked python scripts/check_docs.py
      - run: uv run --locked after-sales --version
      - run: uv run --locked after-sales demo --help
      - run: uv run --locked pytest
      - run: uv run --locked after-sales doctor --json
      - run: uv run --locked after-sales seed --dataset demo --json
      - run: uv run --locked after-sales ticket show T-RETURN-001
      - run: uv run --locked after-sales inspect --ticket T-RETURN-001
      - run: uv run --locked after-sales inspect --ticket T-CONFLICT-001 --json
      - run: uv run --locked after-sales run --ticket T-DELAY-001 --architecture single --model scripted
      - run: uv run --locked after-sales run --ticket T-NOTRECEIVED-002 --model scripted
      - run: uv run --locked after-sales run --ticket T-RETURN-001 --model scripted
      - run: uv run --locked after-sales run --ticket T-DELAY-001 --architecture multi --model scripted
      - run: uv run --locked after-sales run --ticket T-NOTRECEIVED-002 --architecture multi --model scripted
      - run: uv run --locked after-sales run --ticket T-RETURN-001 --architecture multi --model scripted --output var/runs/ci-multi-return.json
      - run: uv run --locked after-sales report show var/runs/ci-multi-return.json --events-only
      - run: uv run --locked after-sales run --ticket T-MISSING-001 --architecture multi --model scripted
      - run: uv run --locked after-sales run --ticket T-DELAY-001 --architecture multi --workflow reviewed --model scripted
      - run: uv run --locked after-sales run --ticket T-RETURN-001 --architecture multi --workflow reviewed --output var/runs/ci-reviewed-pending.json
      - run: uv run --locked after-sales report show var/runs/ci-reviewed-pending.json --events-only
      - run: printf 'ORD-019\napprove\n' | uv run --locked after-sales run --ticket T-MISSING-001 --architecture multi --workflow reviewed --interactive --output var/runs/ci-reviewed-completed.json
      - run: uv run --locked after-sales report show var/runs/ci-reviewed-completed.json --json
      - run: printf 'revise\n9000\nreject\n' | uv run --locked after-sales run --ticket T-NOTRECEIVED-002 --architecture multi --workflow reviewed --interactive
      - run: uv run --locked after-sales run --ticket T-NOTRECEIVED-002 --architecture multi --workflow durable --run-id ci-durable-refund --json --output var/runs/ci-durable-pending.json
      - run: uv run --locked after-sales resume --run ci-durable-refund --json
      - run: printf 'approve\n' | uv run --locked after-sales resume --run ci-durable-refund --output var/runs/ci-durable-completed.json
      - run: uv run --locked after-sales resume --run ci-durable-refund --json
      - run: uv run --locked after-sales report show var/runs/ci-durable-completed.json --json
      - run: uv run --locked after-sales ticket show T-NOTRECEIVED-002
      - run: uv run --locked after-sales order show ORD-004 --customer CUST-A --json
      - run: uv run --locked after-sales live-smoke --json
      - name: Durable parallel resume and cancellation
        env:
          AFTER_SALES_BUSINESS_DB_PATH: var/p07-business.sqlite
          AFTER_SALES_CHECKPOINT_DB_PATH: var/p07-checkpoints.sqlite
        run: |
          uv run --locked after-sales seed --json
          uv run --locked after-sales run --ticket T-NOTRECEIVED-002 --architecture multi --workflow parallel --run-id ci-parallel-refund --json --output var/runs/ci-parallel-pending.json
          uv run --locked after-sales resume --run ci-parallel-refund --json
          printf 'approve\n' | uv run --locked after-sales resume --run ci-parallel-refund --output var/runs/ci-parallel-completed.json
          uv run --locked after-sales report show var/runs/ci-parallel-completed.json --json
          uv run --locked after-sales run --ticket T-MISSING-001 --architecture multi --workflow parallel --run-id ci-parallel-cancel --json
          uv run --locked after-sales cancel --run ci-parallel-cancel --json
          uv run --locked after-sales resume --run ci-parallel-cancel --json
      - name: Real local HTTP create, answer and approve
        run: uv run --locked python scripts/demo_p08.py
      - run: uv build --wheel

  browser-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tools/playwright-browsers
      BROWSER_ARTIFACT_DIR: ${{ github.workspace }}/test-results/browser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.22"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv run --locked playwright install --with-deps chromium
      - name: Real browser flows
        run: uv run --locked pytest -m e2e --allow-hosts=127.0.0.1 tests/test_workbench_e2e.py
      - name: Offline comparison, all 30 cases, three repetitions, actual browser reconnect
        run: uv run --locked after-sales eval run --repetitions 3 --browser --output-dir evals/output/ci-comparison --json
      - name: Save browser screenshots, requests and replay traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-and-evaluation-observations
          path: |
            test-results/browser
            evals/output/ci-comparison
          retention-days: 7
