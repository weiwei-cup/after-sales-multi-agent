name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.22"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest
      - run: uv run --locked after-sales doctor --json
      - run: uv run --locked after-sales seed --dataset demo --json
      - run: uv run --locked after-sales ticket show T-RETURN-001
      - run: uv run --locked after-sales inspect --ticket T-RETURN-001
      - run: uv run --locked after-sales inspect --ticket T-CONFLICT-001 --json
      - run: uv build --wheel
