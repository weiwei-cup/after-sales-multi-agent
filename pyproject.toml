[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "after-sales-multi-agent"
version = "0.10.0"
description = "Evidence-based after-sales workflows with multi-agent collaboration and human approval"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "langchain>=1,<2",
  "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "uvicorn>=0.30,<1",
]

[project.urls]
Repository = "https://github.com/weiwei-cup/after-sales-multi-agent"
Documentation = "https://github.com/weiwei-cup/after-sales-multi-agent/tree/main/docs"
Issues = "https://github.com/weiwei-cup/after-sales-multi-agent/issues"

[project.scripts]
after-sales = "after_sales.cli:main"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "playwright>=1.55,<2",
  "pytest>=8,<10",
  "pytest-socket>=0.7,<1",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/after_sales"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".tools", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not live and not e2e' --disable-socket --allow-unix-socket"
markers = [
  "unit: isolated configuration and domain checks",
  "integration: framework and storage integration checks",
  "recovery: persisted workflow recovery checks",
  "api: HTTP contract checks",
  "e2e: browser checks run separately",
  "live: explicit real model checks requiring credentials",
]
