<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="626" viewBox="0 0 1460 626" role="img" aria-labelledby="title description">
<title id="title">AfterSales system architecture</title>
<desc id="description">The workbench submits scoped, idempotent requests to FastAPI and a durable application service. LangGraph orchestrates read-only Agent tools and approved transactional actions. Business records and graph checkpoints use separate SQLite files.</desc>
<defs>
<marker id="arrow" viewBox="0 0 8 8" refX="7.3" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#262626"/></marker>
</defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#262626">
<text x="40" y="38" font-size="24" font-weight="bold" text-anchor="start" fill="#262626">(a) Service and execution boundaries</text>
<g data-box="Workbench"><rect x="40" y="90" width="220" height="100" fill="white" stroke="#262626" stroke-width="1.3"/>
<text x="150.0" y="123.0" font-size="19" font-weight="bold" text-anchor="middle" fill="#262626">Workbench</text>
<text x="150.0" y="153.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#595959">Customer / operator</text>
<text x="150.0" y="174.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#595959">Requests and polling</text>
</g>
<g data-box="FastAPI"><rect x="320" y="90" width="220" height="100" fill="white" stroke="#262626" stroke-width="1.3"/>
<text x="430.0" y="123.0" font-size="19" font-weight="bold" text-anchor="middle" fill="#262626">FastAPI</text>
<text x="430.0" y="153.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#595959">Identity scope</text>
<text x="430.0" y="174.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#595959">Request validation</text>
</g>
<g data-box="Application service"><rect x="600" y="90" width="240" height="100" fill="white" stroke="#262626" stroke-width="1.3"/>
<text x="720.0" y="123.0" font-size="19" font-weight="bold" text-anchor="middle" fill="#262626">Application service</text>
<text x="720.0" y="153.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#595959">Durable jobs + idempotency</text>
<text x="720.0" y="174.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#595959">Bounded execution workers</text>
</g>
<g data-box="LangGraph runtime"><rect x="920" y="90" width="480" height="100" fill="#edf2f7" stroke="#262626" stroke-width="1.3"/>
<text x="1160.0" y="123.0" font-size="19" font-weight="bold" text-anchor="middle" fill="#262626">LangGraph runtime</text>
<text x="1160.0" y="153.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#595959">LangChain role-local tool loops</text>
<text x="1160.0" y="174.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#595959">Interrupt / resume</text>
</g>
<polyline points="260,140 317,140" fill="none" stroke="#262626" stroke-width="1.45" stroke-linejoin="miter"  marker-end="url(#arrow)"/>
<polyline points="540,140 597,140" fill="none" stroke="#262626" stroke-width="1.45" stroke-linejoin="miter"  marker-end="url(#arrow)"/>
<polyline points="840,140 917,140" fill="none" stroke="#262626" stroke-width="1.45" stroke-linejoin="miter"  marker-end="url(#arrow)"/>
<g data-box="Scoped read-only tools"><rect x="600" y="264" width="240" height="94" fill="white" stroke="#262626" stroke-width="1.3"/>
<text x="720.0" y="294.0" font-size="19" font-weight="bold" text-anchor="middle" fill="#262626">Scoped read-only tools</text>
<text x="720.0" y="324.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#595959">Evidence snapshots</text>
<text x="720.0" y="345.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#595959">Deterministic policy rules</text>
</g>
<g data-box="Transactional action service"><rect x="920" y="264" width="480" height="94" fill="white" stroke="#262626" stroke-width="1.3"/>
<text x="1160.0" y="294.0" font-size="19" font-weight="bold" text-anchor="middle" fill="#262626">Transactional action service</text>
<text x="1160.0" y="324.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#595959">Approval binding + latest-fact / policy checks</text>
<text x="1160.0" y="345.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#595959">Atomic effects + idempotency ledger</text>
</g>
<polyline points="1020,190 1020,224 720,224 720,261" fill="none" stroke="#262626" stroke-width="1.45" stroke-linejoin="miter"  marker-end="url(#arrow)"/>
<text x="827" y="214" font-size="15" font-weight="normal" text-anchor="middle" fill="#595959">Tool calls</text>
<polyline points="1275,190 1275,261" fill="none" stroke="#262626" stroke-width="1.45" stroke-linejoin="miter"  marker-end="url(#arrow)"/>
<text x="1293" y="231" font-size="15" font-weight="normal" text-anchor="start" fill="#595959">Approved</text>
<text x="40" y="430" font-size="24" font-weight="bold" text-anchor="start" fill="#262626">(b) Durable state</text>
<g data-box="Business SQLite"><rect x="40" y="458" width="800" height="94" fill="white" stroke="#262626" stroke-width="1.3"/>
<text x="440.0" y="488.0" font-size="19" font-weight="bold" text-anchor="middle" fill="#262626">Business SQLite</text>
<text x="440.0" y="518.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#595959">Orders / policies / evidence / human inputs / jobs</text>
<text x="440.0" y="539.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#595959">Run budgets / business effects / action ledger / events</text>
</g>
<g data-box="Checkpoint SQLite"><rect x="920" y="458" width="480" height="94" fill="white" stroke="#262626" stroke-width="1.3"/>
<text x="1160.0" y="488.0" font-size="19" font-weight="bold" text-anchor="middle" fill="#262626">Checkpoint SQLite</text>
<text x="1160.0" y="518.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#595959">Graph checkpoints</text>
<text x="1160.0" y="539.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#595959">Workflow / state version manifest</text>
</g>
<polyline points="600,167 570,167 570,455" fill="none" stroke="#262626" stroke-width="1.45" stroke-linejoin="miter" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="556" y="396" font-size="15" font-weight="normal" text-anchor="end" fill="#595959">Jobs / inputs</text>
<polyline points="720,358 720,455" fill="none" stroke="#262626" stroke-width="1.45" stroke-linejoin="miter" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="735" y="395" font-size="15" font-weight="normal" text-anchor="start" fill="#595959">Reads</text>
<polyline points="1190,358 1190,410 810,410 810,455" fill="none" stroke="#262626" stroke-width="1.45" stroke-linejoin="miter" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="1055" y="400" font-size="15" font-weight="normal" text-anchor="middle" fill="#595959">Atomic commit</text>
<polyline points="1400,168 1424,168 1424,505 1403,505" fill="none" stroke="#262626" stroke-width="1.45" stroke-linejoin="miter" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<polyline points="40,592 82,592" fill="none" stroke="#262626" stroke-width="1.45" stroke-linejoin="miter"  marker-end="url(#arrow)"/>
<text x="94" y="597" font-size="15" font-weight="normal" text-anchor="start" fill="#595959">Control flow</text>
<polyline points="236,592 278,592" fill="none" stroke="#262626" stroke-width="1.45" stroke-linejoin="miter" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="290" y="597" font-size="15" font-weight="normal" text-anchor="start" fill="#595959">Data access / persistence</text>
<text x="1420" y="597" font-size="15" font-weight="normal" text-anchor="end" fill="#595959">Offline scripted model  |  Simulated business actions</text>
</g>
</svg>
